name: Quality checks

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - 'main'
      - 'develop'
      - 'stage'

permissions:
  contents: read

jobs:
  lint-and-test:
    permissions:
      contents: read
      packages: read
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/lint-and-test.yml@0744378d42b14fa3dc7bd2073cc8b54e75f90749 # OPS-186 package-authenticated central workflow
    with:
      registry-auth-required: true
    secrets:
      NPM_TOKEN: ${{ github.token }}

  quality-gate:
    name: Quality / core
    if: ${{ always() }}
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require quality workflow
        env:
          QUALITY_RESULT: ${{ needs.lint-and-test.result }}
        run: test "$QUALITY_RESULT" = success

  security:
    name: Security / aggregate
    permissions:
      contents: read
      pull-requests: read
      security-events: write
      packages: read
      packages: read
    uses: otedesco/gh-action-templates/.github/workflows/security.yml@0744378d42b14fa3dc7bd2073cc8b54e75f90749 # OPS-186 package-authenticated central workflow
    with:
      registry-auth-required: true
    secrets:
      NPM_TOKEN: ${{ github.token }}
