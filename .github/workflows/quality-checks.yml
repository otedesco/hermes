name: Quality checks

on:
  workflow_call:
    secrets:
      NPM_TOKEN:
        required: false
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches:
      - 'main'
      - 'develop'
      - 'stage'

permissions:
  contents: read

jobs:
  lint-and-test:
    permissions:
      contents: read
    uses: otedesco/gh-action-templates/.github/workflows/lint-and-test.yml@528e0d92182a23a12f9d6d4dae67c4b0e98fcffb # OPS-183 least-privilege workflows

  quality-gate:
    name: Quality / core
    if: ${{ always() }}
    needs: [lint-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require quality workflow
        env:
          QUALITY_RESULT: ${{ needs.lint-and-test.result }}
        run: test "$QUALITY_RESULT" = success

  security-workflow:
    permissions:
      contents: read
      pull-requests: read
    uses: otedesco/gh-action-templates/.github/workflows/security.yml@32dcc51235dc1332104aab1ceb461e495ba8761f # OPS-184 security gates
    with:
      registry-auth-required: true
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

  security-gate:
    name: Security / aggregate
    if: ${{ always() }}
    needs: [security-workflow]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require security workflow
        env:
          SECURITY_RESULT: ${{ needs.security-workflow.result }}
        run: test "$SECURITY_RESULT" = success
